[package]
name = "reaper_marker_as_key"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0.104"
hooq = "0.3.1"
process_path = "0.1.4"
reaper-low = { git = "https://github.com/helgoboss/reaper-rs.git", rev = "bd7cbb0b83f8f84c0f325557be0ca16bca458b14" }
regex = { version = "1.12", default-features = false, features = ["std", "perf"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
