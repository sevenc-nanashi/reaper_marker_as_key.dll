name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.0, without v)"
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref_type == 'branch' && github.repository_owner == 'sevenc-nanashi'
    runs-on: windows-2022
    permissions:
      contents: write
    env:
      RUSTFLAGS: -C target-feature=+crt-static
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_TAG: v${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v5.2.8
        with:
          cache: false

      - name: Set release version
        run: |
          cargo set-version "$RELEASE_VERSION"
          cargo update --workspace

      - name: Build DLL
        run: cargo build --release

      - name: Commit and tag release
        run: |
          git log -5 --oneline
          git remote -v
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock
          git commit --allow-empty -m "release: ${RELEASE_TAG}"
          git tag "$RELEASE_TAG"

      - name: Prepare ReaPack index
        run: >-
          ruby scripts/package.rb
          "$RELEASE_TAG"
          "$GITHUB_REPOSITORY"
          target/release/reaper_marker_as_key.dll
          dist

      - name: Push release commit and tag
        run: |
          git push --atomic origin "HEAD:refs/heads/$GITHUB_REF_NAME" "refs/tags/$RELEASE_TAG"

      - name: Publish release
        uses: softprops/action-gh-release@v3.0.4
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          make_latest: legacy
          fail_on_unmatched_files: true
          files: |
            dist/reaper_marker_as_key.dll
            dist/index.xml
            LICENSE
